[package]
name = "skills-checker"
version = "0.1.0"
edition = "2021"
description = "CLI 安全检测工具：扫描本地 Agent/SKILL 配置中的安全隐患"
license = "MIT"

[[bin]]
name = "skills-checker"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
